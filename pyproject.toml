[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rowdelta"
version = "0.1.0"
description = "A streaming-friendly toolkit for comparing and validating CSV datasets."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "RowDelta contributors"}]
keywords = ["csv", "data-quality", "diff", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = ["typer>=0.12", "rich>=13.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.115", "ruff>=0.8", "mypy>=1.13", "pytest-cov>=6.0"]

[project.scripts]
rowdelta = "rowdelta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rowdelta"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.hypothesis]
# Keep property tests reproducible in CI; override locally when exploring.
deadline = 500

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rowdelta"]

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
